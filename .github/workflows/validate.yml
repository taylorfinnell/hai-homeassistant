name: Validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The hassfest action is only published from the master branch.
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The HACS action is only published from the main branch. Brands is
      # ignored until hai has an accepted home-assistant/brands entry.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
